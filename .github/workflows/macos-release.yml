name: macOS Build and Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
      - "mac-v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build release binary
        run: |
          chmod +x build.sh
          ./build.sh release
          ls -la dist

      - name: Build DMG
        if: github.event_name != 'pull_request'
        run: |
          chmod +x create-dmg.sh
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ./create-dmg.sh "dist/XYZ Monitor.app" "XYZMonitor-${VERSION}.dmg"
          else
            ./create-dmg.sh "dist/XYZ Monitor.app" "XYZMonitor-main.dmg"
          fi

      - name: Upload DMG artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: XYZMonitor-dmg
          path: XYZMonitor-*.dmg

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            cat > RELEASE_NOTES.md <<EOF
          这是 xyzTrickGview2 for Mac 的发布版本。
          EOF
          fi

          cat >> RELEASE_NOTES.md <<EOF

          ### 安装说明
          - 下载 \`XYZMonitor-${GITHUB_REF_NAME}.dmg\`
          - 双击打开 DMG，将应用拖入“应用程序”
          - 如果 macOS 提示应用来自网络下载，可在终端执行：

          \`\`\`bash
          xattr -dr com.apple.quarantine "/Applications/XYZ Monitor.app"
          \`\`\`
          EOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 版本 ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'mac-v') }}
          body_path: RELEASE_NOTES.md
          files: |
            XYZMonitor-*.dmg
